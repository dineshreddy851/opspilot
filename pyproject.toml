[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opspilot"
version = "0.1.0"
description = "OpsPilot AWS DevOps practice tool"
requires-python = ">=3.10"
dependencies = [
    "boto3",
    "click",
    "python-dotenv"
]

[project.scripts]
opspilot = "opspilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
